name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff (blocking)
        working-directory: backend
        run: ruff check .

      - name: Pytest — unit tests (offline)
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: trackmind_ci
          JWT_SECRET: ci-secret-${{ github.run_id }}
          ADMIN_EMAIL: admin@trackmind.io
          ADMIN_PASSWORD: Admin123!
        run: pytest tests/test_units.py -q

      # Integration tests run against a live server; start it inline.
      - name: Start backend for integration tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: trackmind_ci
          JWT_SECRET: ci-secret-${{ github.run_id }}
          ADMIN_EMAIL: admin@trackmind.io
          ADMIN_PASSWORD: Admin123!
        run: |
          uvicorn server:app --host 0.0.0.0 --port 8001 &
          sleep 5
          curl -f http://localhost:8001/api/health

      - name: Pytest — integration
        working-directory: backend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          ADMIN_EMAIL: admin@trackmind.io
          ADMIN_PASSWORD: Admin123!
        run: pytest tests/test_trackmind.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: corepack enable && yarn --cwd frontend install --frozen-lockfile

      - name: TypeScript typecheck (blocking)
        run: yarn --cwd frontend exec tsc --noEmit

      - name: Jest unit tests (blocking)
        run: yarn --cwd frontend test:ci

      - name: ESLint (non-blocking)
        run: yarn --cwd frontend lint || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml build api

  # Optional: k6 load test — runs only on manual trigger or when label 'loadtest' is set.
  loadtest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run idempotency load test
        env:
          BASE_URL: ${{ secrets.LOADTEST_BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.LOADTEST_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.LOADTEST_ADMIN_PASSWORD }}
        run: k6 run tests/load/approve_idempotency.js
